
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vehicle Sage - Add Admin</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

<style>
body{
font-family:Poppins,sans-serif;
background:#e8edf2;
}
.form-card{
background:white;
border-radius:35px;
box-shadow:0 15px 40px rgba(0,0,0,.08);
}
.logo{
font-family:'Space Grotesk',sans-serif;
}
.inputbox{
border:2px solid #d9d9d9;
transition:.3s;
}
.inputbox:focus{
outline:none;
border-color:#06b6d4;
box-shadow:0 0 15px rgba(6,182,212,.3);
}
</style>
</head>

<body class="min-h-screen flex items-center justify-center p-6">

<div class="form-card w-full max-w-md p-10">

<div class="text-center mb-8">
<h1 class="logo text-4xl">Vehicle Sage</h1>
<p class="text-gray-500 mt-2">
Promote user to admin
</p>
</div>

<div>

<label class="text-gray-500 text-sm block mb-2">
Username
</label>

<input
id="username"
class="inputbox w-full p-4 squared-2xl"
placeholder="@username">

</div>

<button
onclick="addAdmin()"
class="mt-8 w-full bg-cyan-500 hover:bg-indigo-700 text-white p-4 squared-2xl font-semibold">

Add Admin

</button>

<button
onclick="window.location.href='admin_dashboard.html'"
class="mt-3 w-full border border-gray-300 p-4 squared-2xl">

Back

</button>

</div>

<script>

async function addAdmin(){

const username=
document.getElementById(
"username"
).value;

try{

const token=
localStorage.getItem(
"access_token"
);

const response=
await fetch(
`http://localhost:8000/add_admin`,
{
method:"POST", 
headers:{
    
"content-type" :"application/json",
Authorization:`Bearer ${token}`
},
body:JSON.stringify({
user_name:username
})
}
);

const data=
await response.json();

if(response.ok){

alert(
"Admin added successfully"
);

window.location.href=
"admin_dashboard.html";

}else{

alert(
data.detail||
"Failed"
);

}

}catch(error){

console.log(error);

alert(
"Backend connection failed"
);

}

}

</script>

</body>
</html>
