<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Vehicle Sage - Add User</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Space+Grotesk:wght@700&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: Poppins, sans-serif;
            background: white;
        }

        .form-card {
            background: white;
            border-radius: 35px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, .08);
        }

        .logo {
            font-family: 'Space Grotesk', sans-serif;
        }

        .inputbox {
            border: 2px solid #d9d9d9;
            transition: .3s;
        }

        .inputbox:focus {
            outline: none;
            border-color: #06b6d4;
            box-shadow: 0 0 15px rgba(6, 182, 212, .3);
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-6">

    <div class="form-card w-full max-w-md p-10">

        <div class="text-center mb-8">
            <h1 class="logo text-4xl">Vehicle Sage</h1>
            <p class="text-gray-500 mt-2">
                Add a new user account
            </p>
        </div>

        <div class="space-y-5">

            <div>
                <label class="text-black-500 text-sm block mb-2">
                    Username
                </label>

                <input id="username" class="inputbox w-full p-2 squared-2xl" placeholder="@username">
            </div>


            <div>
                <label class="text-black-500 text-sm block mb-2">
                    Email
                </label>

                <input id="email" type="email" class="inputbox w-full p-2 squared-2xl" placeholder="user@example.com">
            </div>


            <div>
                <label class="text-black-500 text-sm block mb-2">
                    Password
                </label>

                <div class="relative">

                    <input id="password" type="password" class="inputbox w-full p-2 squared-2xl"
                        placeholder="Enter password">

                    <button onclick="togglePassword()" type="button" class="absolute right-5 top-4">

                        <span id="eye">👁️</span>

                    </button>

                </div>

            </div>

        </div>

        <button onclick="createUser()"
            class="mt-5 w-full bg-cyan-500 hover:bg-cyan-600 text-white p-4 squareded-2xl font-semibold">

            Create User

        </button>

        <button onclick="window.location.href='admin_dashboard.html'"
            class="mt-3 w-full border border-gray-300 p-4 rounded-2xl">

            Back

        </button>

    </div>

    <script>

        function togglePassword() {

            let p = document.getElementById("password");
            let eye = document.getElementById("eye");

            if (p.type === "password") {
                p.type = "text";
                eye.innerHTML = "🙈";
            } else {
                p.type = "password";
                eye.innerHTML = "👁️";
            }

        }

        async function createUser() {

            const payload = {
                user_name: username.value,
                email: email.value,
                password: password.value
            };

            try {

                const token = localStorage.getItem(
                    "access_token"
                );

                const response = await fetch(
                    "http://localhost:8000/User_Registration",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Authorization": `Bearer ${token}`
                        },
                        body: JSON.stringify(payload)
                    }
                );

                const data = await response.json();

                if (response.ok) {

                    alert("User created successfully");

                    window.location.href =
                        "user.html";

                }
                else {

                    alert(
                        data.detail || "Creation failed"
                    );

                }

            } catch (e) {

                console.log(e);

                alert(
                    "Backend connection failed"
                );

            }

        }

    </script>

</body>

</html>
