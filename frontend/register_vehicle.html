<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        Vehicle Sage - Register Vehicle
    </title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Space+Grotesk:wght@700&display=swap"
        rel="stylesheet"
    >

    <style>

        body{
            font-family:Poppins,sans-serif;
            background:#edf2f7;
        }

        .logo{
            font-family:'Space Grotesk';
        }

        .form-card{
            background:white;
            border-radius:30px;
            box-shadow:0 15px 35px rgba(0,0,0,.08);
        }

        .inputBox{
            border:2px solid #e2e8f0;
            transition:.3s;
        }

        .inputBox:focus{
            outline:none;
            border-color:#06b6d4;
            box-shadow:0 0 15px rgba(6,182,212,.2);
        }

    </style>

</head>

<body
    class="min-h-screen flex justify-center items-center p-8"
>

    <div
        class="form-card w-full max-w-4xl p-10"
    >

        <div class="mb-10">

            <h1
                class="logo text-4xl"
            >

                Vehicle Sage

            </h1>

            <p
                class="text-gray-400 mt-2"
            >

                Register New Vehicle

            </p>

        </div>


        <div
            class="grid grid-cols-2 gap-6"
        >

            <div>

                <label
                    class="block text-sm text-gray-500 mb-2"
                >

                    Vehicle ID

                </label>

                <input
                    id="vehicle_id"
                    class="inputBox w-full p-4 rounded-xl"
                    placeholder="VH001"
                />

            </div>


            <div>

                <label
                    class="block text-sm text-gray-500 mb-2"
                >

                    Vehicle Model

                </label>

                <input
                    id="vehicle_model"
                    class="inputBox w-full p-4 rounded-xl"
                    placeholder="Toyota Fortuner"
                />

            </div>


            <div>

                <label
                    class="block text-sm text-gray-500 mb-2"
                >

                    Vehicle Type

                </label>

                <select
                    id="vehicle_type"
                    class="inputBox w-full p-4 rounded-xl"
                >

                    <option value="ICE">

                        ICE

                    </option>

                    <option value="EV">

                        EV

                    </option>

                </select>

            </div>


            <div>

                <label
                    class="block text-sm text-gray-500 mb-2"
                >

                    Vehicle Class

                </label>

                <select
                    id="vehicle_class"
                    class="inputBox w-full p-4 rounded-xl"
                >

                    <option value="LIGHT">

                        LIGHT

                    </option>

                    <option value="HEAVY">

                        HEAVY

                    </option>


                </select>

            </div>


            <div>

                <label
                    class="block text-sm text-gray-500 mb-2"
                >

                    Year Bought

                </label>

                <input
                    id="year_bought"
                    type="number"
                    class="inputBox w-full p-4 rounded-xl"
                    placeholder="2024"
                />

            </div>

        </div>


        <div class="flex gap-4 mt-10">

            <button
                onclick="registerVehicle()"
                class="flex-1 bg-cyan-500 hover:bg-cyan-600 text-white p-4 rounded-xl font-semibold"
            >

                Register Vehicle

            </button>


            <button
                onclick="window.location.href='dashboard.html'"
                class="flex-1 bg-slate-200 p-4 rounded-xl"
            >

                Cancel

            </button>

        </div>

    </div>


<script>

async function registerVehicle(){

    try{

        const token =
        localStorage.getItem(
            "access_token"
        );
        

        const vehicleData = {

                vehicle_id:
                document.getElementById(
                    "vehicle_id"
                ).value.trim(),

                vehicle_model:
                document.getElementById(
                    "vehicle_model"
                ).value.trim(),

                vehicle_type:
                document.getElementById(
                    "vehicle_type"
                ).value,

                vehicle_class:
                document.getElementById(
                    "vehicle_class"
                ).value,

                year_bought:
                Number(
                    document.getElementById(
                        "year_bought"
                    ).value
                )
            };

console.log(vehicleData);

        const params =
        new URLSearchParams(
            window.location.search
        );

        const userId =
        params.get(
            "user_id"
        );
        console.log("User ID =", userId);

        const url =`http://localhost:8000/register_vehicle/?user_id=${userId}`;

        const response =
        await fetch(
            url,
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json",
                    Authorization:`Bearer ${token}`
                },
                body:JSON.stringify(vehicleData)
            }
        );
        


        const data =
        await response.json();


        if(response.ok){

            alert(
                "Vehicle registered successfully"
            );

            window.location.href =
            "vehicle.html";

        }
        else{

            console.log(data);

            alert(
                JSON.stringify(data)
            );

        }

    }

    catch(err){

        console.log(err);

        alert(
            "Backend connection failed"
        );

    }

}

</script>

</body>

</html>
