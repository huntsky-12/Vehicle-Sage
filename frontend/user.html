<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1"
    >

    <title>
        Vehicle Sage - Users
    </title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        body{
            font-family:Poppins,sans-serif;
            background:#edf2f7;
        }

        .userCard{
            transition:.3s;
        }

        .userCard:hover{
            transform:translateY(-6px);

            box-shadow:
            0 15px 35px rgba(0,0,0,.1);
        }

    </style>

</head>


<body class="p-8">

<div
class="max-w-7xl mx-auto bg-white rounded-[30px] shadow-xl p-8"
>

    <!-- Header -->

    <div class="flex justify-between items-center mb-10">

        <div>

            <h1 class="text-4xl font-bold">
                Users
            </h1>

            <p class="text-gray-400">
                Registered users on Vehicle Sage
            </p>

        </div>


        <div class="flex gap-4">

            <button
                onclick="window.location.href='add_user.html'"
                class="bg-cyan-500 text-white px-6 py-3 rounded-xl"
            >

                Add User

            </button>

        </div>

    </div>


    <!-- User Grid -->

    <div
        id="userContainer"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6"
    >

    </div>

</div>



<script>

async function loadUsers(){

    try{

        const token =
        localStorage.getItem(
            "access_token"
        );


        const response =
        await fetch(
            "http://localhost:8000/GetAllUser",
            {
                headers:{
                    Authorization:
                    `Bearer ${token}`
                }
            }
        );


        const users =
        await response.json();

        let html = '';


        users.forEach(u=>{

            const roleColor =
            u.role==="admin"
            ?
            "bg-cyan-500"
            :
            "bg-slate-300";


            html += `

            <div class="userCard bg-white rounded-2xl p-5 border shadow-sm">

                <div class="flex justify-between items-center mb-5">

                    <div
                    class="w-10 h-10 rounded-full bg-cyan-100 flex justify-center items-center font-bold text-cyan-600">

                        ${u.user_name[0].toUpperCase()}

                    </div>


                    <span
                    class="${roleColor} px-3 py-1 rounded-full text-xs text-white">

                        ${u.role}

                    </span>

                </div>


                <h2 class="font-semibold text-lg">

                    ${u.user_name}

                </h2>


                <p class="text-gray-400 text-sm mb-4">

                    ${u.email}

                </p>


                <div class="space-y-2 text-sm">

                    <div class="flex justify-between">

                        <span class="text-gray-400">

                            Vehicles

                        </span>

                        <span>

                            ${u.vehicles?.length || 0}

                        </span>

                    </div>

                </div>


                <div class="flex gap-2 mt-5">

                    <button
                    class="flex-1 bg-red-500 text-white rounded-lg py-2 hover:bg-red-600" onclick="delete_user('${u.user_id}')">

                        Delete

                    </button>


                    <button
                    onclick="view_vehicle('${u.user_id}')"
                    class="flex-1 bg-cyan-500 text-white rounded-lg py-2 hover:bg-cyan-600">

                        View

                    </button>

                </div>

            </div>

            `;

        });


        document.getElementById(
            "userContainer"
        ).innerHTML = html;

    }

    catch(err){

        console.log(err);

    }

}


async function view_vehicle(userId){

    window.location.href =
    `view_vehicle.html?user_id=${userId}`;

}

async function delete_user(user_id) {
    try{
        const confirmDelete =
        confirm(
            `Delete user ?`
        );
        if(!confirmDelete ){
            return;
        }

        const token =localStorage.getItem("access_token");

        const response =await fetch(`http://localhost:8000/Delete_user/${user_id}`,{
                method:"DELETE",
                headers:{
                    Authorization:
                    `Bearer ${token}`
                }
            }
        );

        const data = await response.json();

        if(response.ok){
            alert("User deleted successfully");
            loadUsers();
        }
        else{
            alert(
                data.detail ||
                "Delete failed"
            );
        }
    }
    catch(err){
        console.log(err);
        alert("Backend connection failed");
    }
}

loadUsers();

</script>

</body>

</html>
